<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>进入网站</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #f7f5f0; color: #26382e; }
    main { box-sizing: border-box; width: min(90vw, 380px); padding: 2rem; background: white; border-radius: 18px; box-shadow: 0 12px 36px #26382e1a; }
    h1 { margin: 0 0 .5rem; font-size: 1.5rem; }
    p { color: #526357; }
    label { display: block; margin: 1.5rem 0 .5rem; }
    input, button { box-sizing: border-box; width: 100%; padding: .8rem; font: inherit; border-radius: 8px; }
    input { border: 1px solid #9daaa0; }
    button { margin-top: 1rem; border: 0; background: #377a57; color: white; cursor: pointer; }
    button:hover { background: #276543; }
    #error { min-height: 1.5em; margin-bottom: 0; color: #b12b36; }
  </style>
</head>
<body>
  <main>
    <h1>欢迎回来 🌿</h1>
    <p>请输入访问密码，继续浏览网站。</p>
    <form id="access-form">
      <label for="password">访问密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button type="submit">进入网站</button>
    </form>
    <p id="error" role="alert" aria-live="polite"></p>
  </main>
  <script>
    const expectedHash = '17be11ae8792358e4980db049f0760d94f063566263fdfe4c3f1c7d1e89ae0f6';
    document.getElementById('access-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const password = document.getElementById('password').value;
      const bytes = new TextEncoder().encode(password);
      const digest = await crypto.subtle.digest('SHA-256', bytes);
      const hash = Array.from(new Uint8Array(digest), byte => byte.toString(16).padStart(2, '0')).join('');
      if (hash === expectedHash) {
        window.location.assign('/home.html');
      } else {
        document.getElementById('error').textContent = '密码不正确，请重试。';
      }
    });
  </script>
</body>
</html>
